<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="form.css">
    <title>Contáctanos | Sweet Glow</title>
</head>
<body>
    <a class="volver" href="index.html">← Volver al inicio</a>
    <img class="logo-form" src="imagenes/logo.png" alt="Logo de Sweet Glow">

    <form id="contactoForm">
        <fieldset>
            <legend>Contáctanos</legend>
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" name="nombre" id="nombre" required>
            </div>
            <div>
                <label for="mensaje">Escribe la razón por la cual deseas contactarnos:</label>
                <textarea id="mensaje" name="mensaje" rows="8" required></textarea>
            </div>
        </fieldset>
        <button type="submit">Enviar</button>
    </form>

    <script src="App.js"></script>
</body>
</html>

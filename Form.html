<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Form.css">
    <title>Regístrate | Sweet Glow</title>
</head>
<body>
    <a class="volver" href="index.html">← Volver al inicio</a>

    <form id="registroForm">
        <fieldset>
            <legend>Datos personales</legend>
            <div>
                <label for="nombre">Nombre de usuario:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" minlength="8" required>
            </div>
            <div>
                <label for="confirm_password">Confirmar contraseña:</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
            </div>
            <div>
                <label for="cargo">Cargo:</label>
                <select id="cargo" name="cargo" required>
                    <option value="">Seleccione un cargo</option>
                    <option value="gerente">Gerente</option>
                    <option value="subgerente">Subgerente</option>
                    <option value="responcaja">Responsable de caja menor</option>
                    <option value="administrador">Administrador</option>
                    <option value="secretaria">Secretaria</option>
                    <option value="vendedor">Vendedor</option>
                </select>
            </div>
        </fieldset>
        <button type="submit">Registrarse</button>
        <a class="enlace-form" href="Inicio Sesion.html"><p>¿Ya tienes una cuenta? Inicia sesión aquí.</p></a>
    </form>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Form.css">
    <title>Inicio de sesión | Sweet Glow</title>
</head>
<body>
    <a class="volver" href="index.html">← Volver al inicio</a>
    <img class="logo-form" src="imagenes/logo.png" alt="Logo de Sweet Glow">

    <form id="loginForm">
        <fieldset>
            <legend>Inicio de sesión</legend>
            <div>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
        </fieldset>
        <button type="submit">Iniciar sesión</button>
        <a class="enlace-form" href="Form.html"><p>¿No tienes cuenta? Regístrate aquí.</p></a>
    </form>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inventario | Sweet Glow</title>
</head>
<body>
    <header>
        <img src="imagenes/logo.png" alt="Logo de Sweet Glow">
        <h1 class="oswald-bold">Inventario</h1>
        <nav>
            <ul>
                <li><a href="user.html">Perfil</a></li>
                <li><a href="Inventario.html">Inventario</a></li>
                <li><a href="facturacion.html">Facturación</a></li>
                <li><a href="index.html">Salir</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Inventario de productos</h1>

        <form id="inventarioForm">
            <div>
                <label for="producto">Producto:</label>
                <input type="text" id="producto" name="producto" required>
            </div>
            <div>
                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" min="0" required>
            </div>
            <div>
                <label for="precio">Precio:</label>
                <input type="number" id="precio" name="precio" min="0" step="0.01" required>
            </div>
            <button type="submit">Agregar al inventario</button>
        </form>

        <h2>Productos ya registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad disponible</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaInventario"></tbody>
        </table>
    </main>

    <script src="app.js"></script>
</body>
</html>

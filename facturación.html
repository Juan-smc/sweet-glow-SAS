<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>

        <label for="cliente">Cliente :</label>
        <input type="text" id="cliente" name="cliente" required>
        <br>
        <label for="numero">Numero:</label>
        <input type="text" id="numero" name="numero" required>
        <br>
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha" required>
        <br>
        <label for="metodo">Metodo de pago:</label>
        <input type="text" id="metodo" name="metodo" required>
        <br>
        <button type="submit">Guardar</button>
        <h3>Datos del cliente</h3>
        <textarea id="datos" name="datos" rows="10" cols="50" readonly></textarea>
        <br>
        <label for="Producto">Producto:</label>
        <input type="text" id="Producto" name="Producto" required>
        <br>
        <label for="Cantidad">Cantidad:</label>
        <input type="number" id="Cantidad" name="Cantidad" required>
        <br>
        <label for="Precio">Precio:</label>
        <input type="number" id="Precio" name="Precio" required>    
        <br>
        <label for="DTO">Dto:</label>
        <input type="number" id="DTO" name="DTO" readonly>
        <br>
        <label for="IVA">IVA:</label>
        <input type="number" id="IVA" name="IVA" readonly>
        <br>
        <h3>Notas/Condiciones</h3>
        <textarea id="notas" name="notas" rows="10" cols="50" readonly></textarea>
        <br>
        <label for="Subtotal">Subtotal:</label>
        <input type="number" id="Subtotal" name="Subtotal" readonly>
        <br>
        <label for="Impuestos">Impuestos:</label>
        <input type="number" id="Impuestos" name="Impuestos" readonly>
        <br>
        <label for="Total">Total:</label>
        <input type="number" id="Total" name="Total" readonly>
        <br>
        <button type="button" onclick="imprimirFactura()">Imprimir</button>
    </form>
</body>
</html>
